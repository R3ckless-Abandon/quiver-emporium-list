name: Update Quiver list

# The site returns 403 to GitHub's servers, so the daily run happens on Dan's PC
# (scripts/sync.cmd via Task Scheduler). This stays as a manual fallback.
on:
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Build list
        run: python scripts/build_list.py

      - name: Commit if changed
        run: |
          if git diff --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add lists/GamingEmporiumExtras.json
          git commit -m "Update Gaming Emporium list"
          git push
